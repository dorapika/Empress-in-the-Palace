const rnd = (n) => Math.floor(Math.random()*n);
const pick = (arr) => arr[rnd(arr.length)];
const rollDie = () => rnd(6)+1;
const drawNumberCard = () => rnd(6)+1;
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]];} return a; }
function charOf(id){ return CHARACTERS.find(c=>c.id===id); }
function itemOf(id){ return ITEM_POOL.find(i=>i.id===id); }
function actionOf(id){ return ACTION_CARDS.find(a=>a.id===id); }
function skillAvailable(p, key){ return G.round >= (p.skillCooldownUntil[key]||0); }
function useSkillCooldown(p, key, cd){ p.skillCooldownUntil[key] = G.round + cd; }

function initGame(playerConfigs){
  G = {
    round: 1,
    order: [],
    orderPos: 0,
    players: playerConfigs.map((cfg, idx)=>{
      const cid = cfg.charId;
      const isAi = !!cfg.isAi;
      const c = charOf(cid);
      const totalCycle = c.cycle.m + c.cycle.f + c.cycle.o;
      const hand = [];
      const startCount = Math.max(1, Math.floor(c.resource/2));
      for(let i=0;i<startCount;i++){
        let pool = ITEM_POOL.filter(x=>x.cat!=='special');
        if(DEBUG_MODE) pool = pool.filter(x=>x.id!=='shiyibeizu');
        hand.push(pick(pool).id);
      }
      return {
        idx, charId: cid, isAi,
        maids:2, eunuchs:1, physicians:1,
        staffTurned:{ maid:0, eunuch:0, physician:0 },
        hand,
        equipped:[],
        equippedExp:{},
        buffs:[],
        pregDelta:0,
        preventMiscarryUntil:0,
        shieldCount:0,
        sickUntil:0,
        cycleTotal: totalCycle,
        cycleClock: rnd(totalCycle),
        pregnancy:null,
        skillCooldownUntil:{},
        skillUsesLeft: Object.fromEntries(c.skills.filter(s=>s.usesLeft!==undefined).map(s=>[s.key,s.usesLeft])),
        knownSitong:{},
        alive:true,
        princes:0, princesses:0,
        miscarryStackCount:0
      };
    }),
    log:[],
    phase:'playerTurn',
    turnStep:'gate',
    pendingAction:null,
    winner:null,
    globalFavorPauseUntil:0,
    extraDrawNextRound:false,
    doubleFavorRound:null
  };
  addLog(`紫禁城選秀落定，六宮主位依序入宮。紅牆深鎖，宮鬥奪嫡風雲啟動！`, { type:'drama' });
  startRound();
}

function startRound(){
  G.order = G.players.filter(p=>p.alive).map(p=>p.idx);
  G.orderPos = 0;
  G.phase = 'playerTurn';
  G.turnStep = 'gate';
}

function addLog(text, opts={}){
  G.log.push(Object.assign({ round:G.round, text, secret:false, revealRound:null, type:'normal' }, opts));
}

function cyclePhase(p){
  const c = charOf(p.charId).cycle;
  const clk = p.cycleClock;
  if(clk < c.m) return 'menses';
  if(clk < c.m + c.f) return 'follicular';
  return 'ovulation';
}

function effectiveStat(p, stat){
  const c = charOf(p.charId);
  const buffSum = p.buffs.filter(b=>b.stat===stat).reduce((s,b)=>s+b.amount,0);
  let equipSum = 0;
  p.equipped.forEach(iid=>{
    const it = itemOf(iid);
    if(it.effect==='equipBuff' && it.stats[stat]) equipSum += it.stats[stat];
    if(it.effect==='buffSideEffect' && it.stat===stat) equipSum += it.amount;
  });
  return Math.max(0, c[stat] + buffSum + equipSum);
}

function currentPlayer(){ return G.players[G.order[G.orderPos]]; }

/* ============================= 核心受孕判定引擎 ============================= */
function performPregnancyRoll(p){
  const die = rollDie();
  let cardCount = Math.max(0, Math.min(3, 2 + (p.pregDelta||0)));
  p.pregDelta = 0;
  const cards = Array.from({length:cardCount}, ()=>drawNumberCard());

  let pregnant = cards.includes(die);
  if(DEBUG_MODE){
    pregnant = true;
    if(cards.length > 0 && !cards.includes(die)){
      cards[0] = die; 
    }
  }
  return { die, cards, pregnant };
}

}

        <div class="drama-quote"><span>「小主玉體欠安，太醫叮囑需安心靜養，切不可勞心費神……」</span></div>
        <p class="muted">你目前重病臥病，本回合無法執行任何普通或秘密行動。</p>
        <div class="row"><button class="gold" onclick="endPlayerTurn()"><i class="fa-solid fa-check"></i> 結束本宮回合</button></div>
      `;
    } else {
      body = `
        <p class="muted">心腹自前朝內務府取來了 3 張行動簽籌，請擇一施行：</p>
        ${G.currentActionChoices.map(aid=>{
          const a = actionOf(aid);
          return `
            <div class="choice-card" onclick="chooseAction('${aid}')">
              <h4>${a.name} <span class="pill" style="background:${a.kind==='secret'?'#e6f4ea':'#fce8e6'}; color:${a.kind==='secret'?'#137333':'#c5221f'};">${a.kind==='secret'?'秘密行動':'普通行動'}</span></h4>
              <p>${a.desc}</p>
            </div>
          `;
        }).join('')}
        ${renderStatusEffects(p)}
        ${renderSkillPanel(p)}
        ${renderHandManager(p)}
      `;

  } else if(G.turnStep==='resolveAction'){
    body = renderActionForm(p);
  } else if(G.turnStep==='poisonAnim'){
    body = renderPoisonAnimView(p);
  } else if(G.turnStep==='dixieAnim'){
    body = renderDixieAnimView(p);
  } else if(G.turnStep==='actionResult'){
    body = `
      <div class="drama-quote">${G.lastActionResultText}</div>
      ${renderHandManager(p)}
      <div class="row" style="margin-top:14px;">
        <button class="gold" onclick="endPlayerTurn()"><i class="fa-solid fa-arrow-right"></i> 移交裝置 · 換下一位小主起居</button>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="card">
      <h2>${c.name}之宮室起居 <span class="tag">第 ${G.round} 回合</span></h2>
      ${body}
    </div>

  `;
}

function renderAiThinkingTurn(p){
  const c = charOf(p.charId);
  app.innerHTML = `
    <div class="card" style="text-align:center; padding:32px 16px;">
      <div style="display:flex; justify-content:center; margin-bottom:12px;">
        <img src="${c.avatar}" class="char-avatar lg fa-beat" style="animation-duration: 2s;" onerror="this.src='https://placehold.co/100x100/7a1f2b/f4e5bf?text=${encodeURIComponent(c.name)}'">
      </div>
      <h2 style="justify-content:center; margin:0 0 6px;">${c.name} · ${c.title} <span class="pill" style="background:#e8f0fe; color:#1a73e8; font-size:.7rem;">電腦 AI</span></h2>
      <p class="muted"><i class="fa-solid fa-spinner fa-spin"></i> 深宮寢殿悄掩宮門，小主正在暗中審度局勢與籌謀行事…</p>
      <div class="drama-quote" style="max-width:460px; margin:10px auto;"><span>${c.quote}</span></div>
    </div>
    ${renderLogCard()}
  `;

  if(G._aiTimeout){
    clearTimeout(G._aiTimeout);
  }
  G._aiTimeout = setTimeout(() => {
    G._aiTimeout = null;
    executeAiTurn(p);
  }, AI_SPEED);
}

function executeAiTurn(p){
  let willHandleSpecialTransition = false;
  try {
    const c = charOf(p.charId);
    const sick = G.round <= p.sickUntil;

    // 1. AI 步向內務府抽道具卡
    let pool = ITEM_POOL.filter(x => x.cat !== 'special');
    if(DEBUG_MODE) pool = pool.filter(x => x.id !== 'shiyibeizu');
    const drawnItem = pick(pool);
    p.hand.push(drawnItem.id);

    // 2. AI 穿戴/使用合適之道具
    if(drawnItem.cat === 'equip' || drawnItem.equippable){
      equipItemDirect(p, drawnItem.id);
    }
    const usableTonics = p.hand.filter(iid => {
      const it = itemOf(iid);
      return isUsableTonic(it) && (!it.onlyTarget || it.onlyTarget === p.charId);
    });
    if(usableTonics.length > 0){
      const useIid = usableTonics[0];
      useItemDirect(p, useIid);
    }

    // 3. AI 特技判斷
    // 安陵容製香
    if(p.charId === 'anda_ying' && (p.skillUsesLeft['chenshui'] || 0) > 0 && p.hand.length > 0){
      const hasPoison = p.hand.some(iid => itemOf(iid).cat === 'poison');
      if(!hasPoison){
        const srcIid = p.hand[0];
        const srcIdx = p.hand.indexOf(srcIid);
        p.hand.splice(srcIdx, 1, 'shexiang');
        p.skillUsesLeft['chenshui']--;
        addLog(`【沉水暗香·巧手調香】安陵容素手撥香匙，悄無聲息地將手中道具研磨精製合成了奇香「麝香」！`, { type:'drama' });
      }
    }

    // 沈眉莊天仙媚酒：私通不被太醫發現，脈象視為天衣無縫之正統龍胎 (fromSitong: false)
    if(p.charId === 'huiguiren' && cyclePhase(p) === 'ovulation' && (p.skillUsesLeft['tianxian'] || 0) > 0){
      p.skillUsesLeft['tianxian']--;
      addLog(`【天仙媚酒】惠貴人藉御酒之意深夜私通幽會！太醫平安脈亦查不出異狀，視為正統龍胎！`, { type:'drama' });
      const result = performPregnancyRoll(p);
      if(result.pregnant){
        p.pregnancy = { startRound: G.round, fromSitong: false };
      }
      endPlayerTurn();
      return;
    }

    // 皇后/甄嬛增益特技
    c.skills.forEach(s => {
      if(SELF_BUFF_SKILL_TYPES.includes(s.type) && skillAvailable(p, s.key)){
        if(s.type === 'active-allstats'){
          ['beauty','intel','talent'].forEach(stat => p.buffs.push({ stat, amount:s.amount, untilRound:G.round+1 }));
          useSkillCooldown(p, s.key, s.cooldown);
          addLog(`【純元護體】${c.name}哭訴先皇后深情往事，本回合全能力 +${s.amount}！`, { type:'drama' });
        } else if(s.type === 'active-beautytalent'){
          p.buffs.push({ stat:'beauty', amount:s.amount, untilRound:G.round+1 });
          p.buffs.push({ stat:'talent', amount:s.amount, untilRound:G.round+1 });
          useSkillCooldown(p, s.key, s.cooldown);
          addLog(`【蝶舞飛仙】${c.name}翩躚一舞，美貌與才藝各 +${s.amount}！`, { type:'drama' });
        }
      }
    });

    if(sick){
      endPlayerTurn();
      return;
    }

    // 4. 抽取 3 張行動卡並進入 AI 策略樹
    const actionChoices = shuffle(ACTION_CARDS.map(a => a.id)).slice(0, 3);
    const others = otherAlivePlayers(p);
    if(!others.length){
      endPlayerTurn();
      return;
    }

    if(!p.knownSitong) p.knownSitong = {};

    const confirmedSitongTarget = others.find(o => o.pregnancy && p.knownSitong[o.idx] === true);
    const uninvestigatedPregTarget = others.find(o => o.pregnancy && p.knownSitong[o.idx] === undefined);

    let target = confirmedSitongTarget || others.find(o => o.pregnancy) || others.slice().sort((a,b)=>(b.princes*2 + b.princesses) - (a.princes*2 + a.princesses))[0];

    const poisonsInHand = p.hand.filter(iid => itemOf(iid).cat === 'poison');
    const phase = cyclePhase(p);

    let chosenAid = actionChoices[0];

    /* ================= AI 滴血認親與深度宮鬥策略樹 ================= */
    if(actionChoices.includes('dixie') && confirmedSitongTarget){
      chosenAid = 'dixie';
      target = confirmedSitongTarget;
    }
    else if(actionChoices.includes('dixie') && p.charId === 'huanghou' && others.some(o => o.pregnancy)){
      chosenAid = 'dixie';
      target = others.find(o => o.pregnancy);
    }
    else if(actionChoices.includes('sitong') && phase === 'ovulation' && !p.pregnancy){
      chosenAid = 'sitong';
    }
    else if(actionChoices.includes('baping') && uninvestigatedPregTarget && p.physicians > 0){
      chosenAid = 'baping';
      target = uninvestigatedPregTarget;
    }
    else if(actionChoices.includes('poison') && poisonsInHand.length > 0){
      chosenAid = 'poison';
    }
    else if(actionChoices.includes('persuade')){
      chosenAid = 'persuade';
    }
    else if(actionChoices.includes('steal') && others.some(o => o.equipped.length > 0) && p.eunuchs > 0){
      chosenAid = 'steal';
    }
    else if(actionChoices.includes('baping') && p.physicians > 0){
      chosenAid = 'baping';
    }
    else if(chosenAid === 'dixie' && !confirmedSitongTarget && p.charId !== 'huanghou'){
      const alt = actionChoices.find(a => a !== 'dixie');
      if(alt) chosenAid = alt;
    }

    if(chosenAid === 'dixie'){
      willHandleSpecialTransition = true;
      G.pendingAction = { id:'dixie', targetIdx: target.idx };
      addLog(`【景仁宮風雲起】${c.name}毅然出列，當眾指控${charOf(target.charId).name}混淆皇室血脈，奏請滴血認親！`, { type:'drama' });
      resolveDixie();
      return;
    } else {
      executeAiAction(p, chosenAid, target, poisonsInHand);
    }
  } catch(e) {
    console.warn("AI 行動執行異常防護：", e);
  } finally {
    if(!willHandleSpecialTransition){
      endPlayerTurn();
    }
  }
}

function executeAiAction(p, aid, target, poisonsInHand){
  const c = charOf(p.charId);
  const tc = charOf(target.charId);

  switch(aid){
    case 'sitong': {
      const result = performPregnancyRoll(p);
      if(result.pregnant){
        p.pregnancy = { startRound: G.round, fromSitong: true };
      }
      addLog(`${c.name}於夜色闌珊之際掩上宮門，悄然執行了一項秘密行動……`, { secret:true, revealRound:G.round+1 });
      break;
    }
    case 'poison': {
      if(!poisonsInHand.length) break;
      const iid = poisonsInHand[0];
      const it = itemOf(iid);
      consumeItem(p, iid);

      const baseIntel = effectiveStat(p, 'intel');
      let dice = Math.max(1, Math.floor(baseIntel / 2));
      const targetSkill = charOf(target.charId).skills.find(s => s.type === 'passive-poisonresist');
      if(targetSkill) dice = Math.max(1, Math.floor(dice / 2));

      const need = it.check || [];
      const rolls = Array.from({ length:dice }, () => rollDie());
      const success = need.length > 0 ? rolls.some(r => need.includes(r)) : true;

      let logTxt = `【深宮投毒】${c.name}命人對${tc.name}施放「${it.name}」，智能考驗擲出：${rolls.join('、')} — ${success ? '【得手成功】！' : '【功虧一簣】！'}`;
      if(success) applyItemEffect(it, target, p);
      addLog(logTxt, { type:'drama' });
      break;
    }
    case 'persuade': {
      let intel = effectiveStat(p, 'intel');
      const pSkill = c.skills.find(s => s.type === 'passive-persuade');
      if(pSkill) intel += pSkill.amount;
      const dice = Math.max(1, Math.floor(intel / 2));
      const rolls = Array.from({ length:dice }, () => rollDie());
      const success = rolls.some(r => r === 5 || r === 6);

      if(target.maids > (target.staffTurned.maid||0) && success){
        target.staffTurned.maid = (target.staffTurned.maid||0) + 1;
        addLog(`${c.name}暗中於西華門密會他宮眼線，播下了變節的種子……`, { secret:true, revealRound:G.round+1 });
      }
      break;
    }
    case 'steal': {
      if(target.equipped.length > 0 && p.eunuchs > 0 && (p.staffTurned.eunuch||0) < p.eunuchs){
        const stolenIid = pick(target.equipped);
        target.equipped = target.equipped.filter(x => x !== stolenIid);
        p.hand.push(stolenIid);
        addLog(`【宮闈失竊】${tc.name}宮中晨起清點，發現一件佩飾不翼而飛！`, { type:'drama' });
      }
      break;
    }
    case 'baping': {
      if(!p.knownSitong) p.knownSitong = {};
      const isSitong = !!(target.pregnancy && target.pregnancy.fromSitong);
      p.knownSitong[target.idx] = isSitong;
      addLog(`${c.name}宣召太醫密探${tc.name}之脈象，洞悉了六宮深閨秘辛。`);
      break;
    }
    case 'zhangbi': {
      for(const role of ['maid', 'eunuch', 'physician']){
        if((p.staffTurned[role] || 0) > 0){
          p[role==='maid'?'maids':(role==='eunuch'?'eunuchs':'physicians')]--;
          p.staffTurned[role]--;
          addLog(`【重刑整飭宮規】${c.name}當場杖斃了一名變節叛奴，肅清門戶！`, { type:'drama' });
          break;
        }
      }
      break;
    }
  }
}

function equipItemDirect(p, iid){
  const idx = p.hand.indexOf(iid);
  if(idx >= 0){
    p.hand.splice(idx, 1);
    p.equipped.push(iid);
    const it = itemOf(iid);
    if(it.duration){
      if(!p.equippedExp) p.equippedExp = {};
      p.equippedExp[iid] = G.round + it.duration;
    }
    if(it.pregPenalty){
      p.pregDelta = (p.pregDelta || 0) + it.pregPenalty;
    }
    addLog(`【步搖生姿】${charOf(p.charId).name}將「${it.name}」妥帖穿戴佩戴於身！`, { type:'drama' });
  }
}

function useItemDirect(p, iid){
  const it = itemOf(iid);
  consumeItem(p, iid);
  switch(it.effect){
    case 'preventMiscarry': p.preventMiscarryUntil = G.round + it.duration; break;
    case 'shield': p.shieldCount = (p.shieldCount || 0) + 1; break;
    case 'doubleFavor': G.doubleFavorRound = G.round; break;
    case 'pregDebuff': p.pregDelta = (p.pregDelta || 0) + it.amount; break;
    case 'cureSick': p.sickUntil = 0; p.buffs = p.buffs.filter(b => b.amount >= 0); break;
    case 'cureOne': { const idx = p.buffs.findIndex(b => b.amount < 0); if(idx >= 0) p.buffs.splice(idx, 1); break; }
    case 'buff': p.buffs.push({ stat:it.stat, amount:it.amount, untilRound:G.round + it.duration }); break;
    case 'forceOvulation': { const c = charOf(p.charId).cycle; p.cycleClock = c.m + c.f; break; }
  }
}

function renderStatusEffects(p){
  const bits = [];
  if(p.preventMiscarryUntil >= G.round){
    bits.push(`<i class="fa-solid fa-shield-heart"></i> 安胎護脈中（尚餘 ${p.preventMiscarryUntil - G.round + 1} 回合防止滑胎）`);
  }
  if(p.shieldCount > 0){
    bits.push(`<i class="fa-solid fa-shield-halved"></i> 東阿阿膠護體金鐘（抵禦負面厄運：${p.shieldCount} 次）`);
  }
  if(p.pregDelta !== 0){
    bits.push(`<i class="fa-solid fa-pills"></i> 胞宮調理：下次受孕${p.pregDelta > 0 ? '多':'少'}抽 ${Math.abs(p.pregDelta)} 張數字卡`);
  }
  if(!bits.length) return '';
  return `<p class="muted" style="color:var(--jade); background:#f0f9f5; padding:6px 10px; border-left:3px solid var(--jade);">${bits.join('<br>')}</p>`;
}

const SELF_BUFF_SKILL_TYPES = ['active-allstats','active-beautytalent'];

function renderSkillPanel(p){
  const c = charOf(p.charId);
  const usable = c.skills.filter(s => SELF_BUFF_SKILL_TYPES.includes(s.type));
  const isAn = p.charId === 'anda_ying';
  const chenshuiUses = p.skillUsesLeft ? (p.skillUsesLeft['chenshui'] || 0) : 0;
  
  const isMei = p.charId === 'huiguiren';
  const meiSkill = isMei ? c.skills.find(s => s.key === 'tianxian') : null;
  const meiUsable = meiSkill && (p.skillUsesLeft['tianxian'] > 0) && (cyclePhase(p) === 'ovulation');

  if(!usable.length && !isAn && !meiUsable) return '';
  return `
    <div class="fieldset">
      <label><i class="fa-solid fa-wand-magic-sparkles"></i> 六宮主位特技</label>
      <div class="itemlist">
        ${usable.map(s => {
          const avail = skillAvailable(p, s.key);
          const remain = avail ? 0 : (p.skillCooldownUntil[s.key] - G.round);
          return `
            <div class="itemrow">
              <span><span class="nm">${s.name}</span><span class="ds">${s.desc}</span></span>
              ${avail ? `<button onclick="useCharSkill('${s.key}')"><i class="fa-solid fa-bolt"></i> 發動</button>`
                      : `<span class="muted" style="font-size:.75rem;">冷卻中（剩 ${remain} 回合）</span>`}
            </div>
          `;
        }).join('')}
        ${meiUsable ? `
          <div class="itemrow" style="background:#fffcf2; border-color:var(--gold);">
            <span>
              <span class="nm" style="color:var(--crimson-dark);"><i class="fa-solid fa-wine-glass"></i> 天仙媚酒</span>
              <span class="pill" style="background:#f0e4c8; font-weight:bold; color:#6d4814;">排卵期專屬特技</span>
              <br><span class="ds">${meiSkill.desc}</span>
            </span>
            <button class="gold" onclick="useTianxianMeijiu()"><i class="fa-solid fa-moon"></i> 發動私通</button>
          </div>
        ` : (isMei && p.skillUsesLeft['tianxian'] > 0 && cyclePhase(p) !== 'ovulation' ? `
          <div class="itemrow">
            <span><span class="nm">天仙媚酒</span><span class="ds">（須於排卵期方可發動天仙媚酒強制私通）</span></span>
            <span class="muted" style="font-size:.75rem;">等待排卵期</span>
          </div>
        ` : '')}
        ${isAn ? `
          <div class="itemrow" style="background:#fffcf2; border-color:var(--gold);">
            <span>
              <span class="nm" style="color:var(--crimson-dark);"><i class="fa-solid fa-mortar-pestle"></i> 沉水暗香</span>
              <span class="pill" style="background:#f0e4c8; font-weight:bold; color:#6d4814;">剩餘 ${chenshuiUses} / 3 次</span>
              <br><span class="ds">深諳製香秘術，可將手中任一道具轉化為麝香、歡宜香、舒痕膠、凝露香或息肌丸。</span>
            </span>
            ${chenshuiUses > 0 
              ? `<button class="gold" onclick="openChenshuiModal()"><i class="fa-solid fa-wand-magic-sparkles"></i> 凝香煉化</button>`
              : `<span class="muted" style="font-size:.75rem;">（三度製香機緣已盡）</span>`}
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function useCharSkill(key){
  const p = currentPlayer();
  const c = charOf(p.charId);
  const s = c.skills.find(sk => sk.key === key);
  if(!s || !skillAvailable(p, key)) return;
  if(s.type === 'active-allstats'){
    ['beauty','intel','talent'].forEach(stat => p.buffs.push({ stat, amount:s.amount, untilRound:G.round+1 }));
    useSkillCooldown(p, key, s.cooldown);
    addLog(`【純元護體】${c.name}哭訴先皇后深情往事，皇上百感交集，本回合全能力 +${s.amount}！`, { type:'drama' });
  } else if(s.type === 'active-beautytalent'){
    p.buffs.push({ stat:'beauty', amount:s.amount, untilRound:G.round+1 });
    p.buffs.push({ stat:'talent', amount:s.amount, untilRound:G.round+1 });
    useSkillCooldown(p, key, s.cooldown);
    addLog(`【蝶舞飛仙】${c.name}溫泉藏蝶翩躚一舞，引得龍顏大悅，美貌與才藝各 +${s.amount}！`, { type:'drama' });
  }
  render();
}

function useTianxianMeijiu(){
  const p = currentPlayer();
  if(p.charId !== 'huiguiren' || cyclePhase(p) !== 'ovulation' || (p.skillUsesLeft['tianxian']||0) <= 0) return;
  p.skillUsesLeft['tianxian']--;
  addLog(`【天仙媚酒】惠貴人深宮寂寞鬱鬱寡歡，藉御酒之意深夜私通幽會！太醫把平安脈亦查不出異樣，視為正統龍胎！`, { type:'drama' });
  
  const result = performPregnancyRoll(p);
  if(result.pregnant){
    p.pregnancy = { startRound: G.round, fromSitong: false };
  }
  G.pregAnimResult = result;
  G.pregAnimTarget = p.idx;
  G.pregAnimMode = 'sitong';
  G.phase = 'pregnancyGate';
  G.pregnancyGateRevealed = true;
  G.pregAnim = { stage:'die-rolling', _started:false };
  render();
}

function renderHandManager(p){
  const isAn = p.charId === 'anda_ying';
  const chenshuiUses = p.skillUsesLeft ? (p.skillUsesLeft['chenshui'] || 0) : 0;
  return `
    <div class="fieldset">
      <label><i class="fa-solid fa-treasure-chest"></i> 妝匣行囊（僅自己可見）</label>
      <div class="itemlist">
        ${p.hand.length ? p.hand.map(iid => {
          const it = itemOf(iid);
          const canEquip = it.cat === 'equip' || !!it.equippable;
          const usable = isUsableTonic(it);
          const blockedByOnlyTarget = it.onlyTarget && p.charId !== it.onlyTarget;
          let btn = '';
          if(canEquip) btn = `<button onclick="equipItem('${iid}')"><i class="fa-solid fa-gem"></i> 裝備</button>`;
          else if(usable){
            btn = blockedByOnlyTarget
              ? `<span class="muted" style="font-size:.72rem;">（僅${charOf(it.onlyTarget).name}服之有效）</span>`
              : `<button onclick="useItem('${iid}')"><i class="fa-solid fa-spoon"></i> 服用</button>`;
          }
          const chenshuiBtn = (isAn && chenshuiUses > 0)

function isUsableTonic(it){
  return it.cat==='tonic' && ['preventMiscarry','shield','doubleFavor','pregDebuff','cureSick','cureOne','buff','forceOvulation'].includes(it.effect);
}

function useItem(iid){
  const p = currentPlayer();
  const it = itemOf(iid);
  if(it.onlyTarget && p.charId !== it.onlyTarget) return;
  consumeItem(p, iid);
  let text = '';
  switch(it.effect){
    case 'preventMiscarry':
      p.preventMiscarryUntil = G.round + it.duration;
      text = `服下了「${it.name}」，神清氣爽，防止滑胎保胎效力持續 ${it.duration} 回合！`;
      break;
    case 'shield':
      p.shieldCount = (p.shieldCount || 0) + 1;
      text = `服下了名貴的「${it.name}」，獲得東阿阿膠金鐘護體，下次遭逢厄運時將化險為夷！`;
      break;
    case 'doubleFavor':
      G.doubleFavorRound = G.round;
      text = `命人端上了滾燙的「${it.name}」，皇上龍精虎猛，本回合爭寵前二名小主皆將同沐龍恩！`;
      break;
    case 'pregDebuff':
      p.pregDelta = (p.pregDelta || 0) + it.amount;
      text = `服下了「${it.name}」，下一次懷孕檢定將${it.amount>0?'多':'少'}抽 ${Math.abs(it.amount)} 張數字卡！`;
      break;
    case 'cureSick':
      p.sickUntil = 0;
      text = `服下了溫熱的「${it.name}」，清熱拔毒，頭風發作或時疫所致之臥病狀態霍然而癒！`;
      break;
    case 'cureOne':
      { const idx = p.buffs.findIndex(b => b.amount < 0); if(idx >= 0) p.buffs.splice(idx, 1); }
      text = `服用了清熱解毒的「${it.name}」，體內毒素盡消，解除了一項負面狀態！`;
      break;
    case 'buff':
      p.buffs.push({ stat:it.stat, amount:it.amount, untilRound:G.round + it.duration });
      text = `服用了「${it.name}」，只覺氣色紅潤，${{beauty:'美貌',talent:'才藝',intel:'智能'}[it.stat]} +${it.amount}，持續 ${it.duration} 回合！`;
      break;
    case 'forceOvulation':
      { const c = charOf(p.charId).cycle; p.cycleClock = c.m + c.f; }
      text = `暗服了太醫密授的「${it.name}」，氣血奔湧，強制進入最佳受孕之【排卵期】！`;
      break;
  }
  addLog(`${charOf(p.charId).name}：${text}`, { type:'drama' });
  render();
}

function resolveChenshuiTransform(){
  const p = currentPlayer();
  if(!p || p.charId !== 'anda_ying') return;
  const usesLeft = p.skillUsesLeft ? (p.skillUsesLeft['chenshui'] || 0) : 0;
  if(usesLeft <= 0) return;

  const sourceIid = val('f_chenshui_source');
  const destRadio = document.querySelector('input[name="chenshui_dest"]:checked');
  const destIid = destRadio ? destRadio.value : null;

  if(!sourceIid || !destIid) return;
  const sourceIdx = p.hand.indexOf(sourceIid);
  if(sourceIdx === -1) return;

  const oldItem = itemOf(sourceIid);
  const newItem = itemOf(destIid);

  p.hand.splice(sourceIdx, 1, destIid);
  p.skillUsesLeft['chenshui']--;

  const dramaMsg = `【沉水暗香·巧手調香】安陵容素手撥香匙，悄無聲息地將手中「${oldItem.name}」研磨煉化，精製合成了奇香「${newItem.name}」！（剩餘可製香次數：${p.skillUsesLeft['chenshui']} 次）`;
  addLog(dramaMsg, { type:'drama' });

  closePalaceModal();
  render();
}

function equipItem(iid){
  const p = currentPlayer();
  const idx = p.hand.indexOf(iid);
  if(idx >= 0){
    p.hand.splice(idx, 1);
    p.equipped.push(iid);
    const it = itemOf(iid);
    if(it.duration){
      if(!p.equippedExp) p.equippedExp = {};
      p.equippedExp[iid] = G.round + it.duration;
    }
    if(it.pregPenalty){
      p.pregDelta = (p.pregDelta || 0) + it.pregPenalty;
    }
    addLog(`【步搖生姿】${charOf(p.charId).name}將「${it.name}」妥帖穿戴佩戴於身！（${it.desc}）`, { type:'drama' });
  }
  render();
}

function cancelAction(){ G.turnStep='chooseAction'; render(); }
function val(id){ const el = document.getElementById(id); return el? el.value : null; }
function checked(id){ const el = document.getElementById(id); return el? !!el.checked : false; }

function consumeItem(p, iid){
  const idx = p.hand.indexOf(iid);
  if(idx >= 0) p.hand.splice(idx, 1);
}

/* ================= 4. 行動結算邏輯 ================= */
function tryShieldBlock(target, label){
  if(target.shieldCount > 0){
    target.shieldCount--;
    addLog(`【阿膠金鐘護體】${charOf(target.charId).name}體內東阿阿膠靈效化為金光，替其擋下了「${label}」之厄運！`, { type:'drama' });
    return true;
  }
  return false;
}

function resolvePoison(){
  const p = currentPlayer();
  const iid = val('f_item');
  const targetIdx = G.pendingAction.targetIdx;
  const role = val('f_exec');
  const target = G.players[targetIdx];
  const it = itemOf(iid);

  const roleCount = { maid:p.maids, eunuch:p.eunuchs, physician:p.physicians }[role];
  const turnedCount = p.staffTurned[role] || 0;
  if(roleCount < 1){
    G.lastActionResultText = '小主宮中並無可支使之宮人。';
    G.turnStep = 'actionResult'; render(); return;
  }

  if(turnedCount >= roleCount){
    consumeItem(p, iid);
    const roleName = { maid:'貼身宮女', eunuch:'首領太監', physician:'隨侍太醫' }[role];
    const dramaticFail = `【全員背叛·當場反咬】${charOf(p.charId).name}宮中所有${roleName}早已全部被收買策反！指派差役無忠僕可用，叛奴暗中將奇毒「${it.name}」倒入院中花泥，並向六宮曝光了自身變節的罪證！`;
    addLog(dramaticFail, { type:'drama' });
    G.lastActionResultText = dramaticFail;
    G.turnStep = 'actionResult'; render(); return;
  }

  const baseIntel = effectiveStat(p, 'intel');
  let dice = Math.max(1, Math.floor(baseIntel / 2));
  const skillDie = charOf(p.charId).skills.find(s => s.type === 'active-poisondie');
  let usedSkill = false;
  if(skillDie && skillAvailable(p, skillDie.key) && checked('f_useskill')){
    dice += skillDie.amount;
    usedSkill = true;
    useSkillCooldown(p, skillDie.key, skillDie.cooldown);
  }

  const targetSkill = charOf(target.charId).skills.find(s => s.type === 'passive-poisonresist');
  const isMeizhuangResist = !!targetSkill;
  if(isMeizhuangResist){
    dice = Math.max(1, Math.floor(dice / 2));
  }

  consumeItem(p, iid);

  const need = it.check || [];
  const rolls = Array.from({ length:dice }, () => rollDie());
  const success = need.length > 0 ? rolls.some(r => need.includes(r)) : true;

  G.poisonAnim = {
    stage: 'rolling',
    _started: false,
    dice,
    rolls,
    need,
    success,
    it,
    targetIdx,
    usedSkill,
    isMeizhuangResist,
    baseIntel
  };
  G.turnStep = 'poisonAnim';
  render();
}

function runPoisonDiceAnimation(){
  const anim = G.poisonAnim;
  const faces = ['1','2','3','4','5','6'];
  let ticks = 0;
  const iv = setInterval(() => {
    ticks++;
    for(let i=0; i<anim.dice; i++){
      const el = document.getElementById('p_die_' + i);
      if(el) el.textContent = faces[rnd(6)];
    }
    if(ticks >= 11){
      clearInterval(iv);
      anim.stage = 'settled';
      render();
      setTimeout(() => {
        anim.stage = 'result';
        render();
      }, 500);
    }
  }, 75);
}

function finishPoisonAnim(){
  const anim = G.poisonAnim;
  const p = currentPlayer();
  const target = G.players[anim.targetIdx];
  const it = anim.it;

  let resultText = `【深宮投毒】${charOf(p.charId).name}命人對${charOf(target.charId).name}施放「${it.name}」${anim.usedSkill ? '（仗勢欺人霸道加骰）' : ''}，智能考驗擲出：${anim.rolls.join('、')}（需 ${anim.need.join('或')}）— ${anim.success ? '【得手成功】！' : '【功虧一簣】！'}`;

  if(anim.success){
    applyItemEffect(it, target, p);
  }
  addLog(resultText, { type:'drama' });
  G.lastActionResultText = resultText;
  G.turnStep = 'actionResult';
  G.poisonAnim = null;
  render();
}

function applyItemEffect(it, target, actor){
  switch(it.effect){
    case 'miscarry':
      if(tryShieldBlock(target, it.name)) break;
      if(target.pregnancy && G.round > (target.preventMiscarryUntil || 0)){
        target.pregnancy = null;
        addLog(`【血染深宮】${charOf(target.charId).name}受「${it.name}」奇毒侵體，龍胎難保，不幸滑胎！`, { type:'drama' });
      }
      break;
    case 'miscarryStack':
      target.miscarryStackCount = (target.miscarryStackCount || 0) + 1;
      if(target.miscarryStackCount >= 2 && target.pregnancy && G.round > (target.preventMiscarryUntil || 0)){
        if(tryShieldBlock(target, it.name)){ target.miscarryStackCount = 0; break; }
        target.pregnancy = null;
        addLog(`【舒痕慢毒】${charOf(target.charId).name}日日塗抹舒痕膠，麝毒累積攻心，終致滑胎小產！`, { type:'drama' });
      }
      break;
    case 'pregDebuff':
      if(it.amount < 0 && tryShieldBlock(target, it.name)) break;
      target.pregDelta += it.amount;
      break;
    case 'cycleReset':
      if(tryShieldBlock(target, it.name)) break;
      target.cycleClock = 0;
      addLog(`【氣血紊亂】${charOf(target.charId).name}服下共筆秘方，經期大亂直接跳入月經期！`, { type:'drama' });
      break;
    case 'sick':
      if(tryShieldBlock(target, it.name)) break;
      target.sickUntil = G.round + 1;
      addLog(`【染疫抱恙】${charOf(target.charId).name}遭時疫茶盞所害，臥病在床无法動彈！`, { type:'drama' });
      break;
    case 'statDown':
      if(tryShieldBlock(target, it.name)) break;
      target.buffs.push({ stat:it.stat, amount:-it.amount, untilRound:G.round + 2 });
      break;
    case 'killNewborn':
      if(target.princes > 0 || target.princesses > 0){
        if(tryShieldBlock(target, it.name)) break;
        if(target.princes > 0) target.princes--; else target.princesses--;
        addLog(`【木薯粉案】${charOf(target.charId).name}膝下尚在襁褓之皇嗣誤食木薯粉，未及滿月便夭折離世……`, { type:'drama' });
      }
      break;
    case 'buff':
      target.buffs.push({ stat:it.stat, amount:it.amount, untilRound:G.round + it.duration });
      break;
    case 'buffSideEffect':
      target.buffs.push({ stat:it.stat, amount:it.amount, untilRound:G.round + it.duration });
      target.pregDelta -= 1;
      break;
    case 'preventMiscarry':
      target.preventMiscarryUntil = G.round + it.duration;
      break;
    case 'shield':
      target.shieldCount = (target.shieldCount || 0) + 1;
      break;
    case 'cureSick':
      target.sickUntil = 0;
      target.buffs = target.buffs.filter(b => b.amount >= 0);
      break;
    case 'cureOne':
      { const idx = target.buffs.findIndex(b => b.amount < 0); if(idx >= 0) target.buffs.splice(idx, 1); }
      break;
    case 'forceOvulation':
      { const c = charOf(target.charId).cycle; target.cycleClock = c.m + c.f; }
      break;
  }
}

function resolvePersuade(){
  const p = currentPlayer();
  const targetIdx = G.pendingAction.targetIdx;
  const role = val('f_role');
  const target = G.players[targetIdx];
  let intel = effectiveStat(p, 'intel');

  const persuadeSkill = charOf(p.charId).skills.find(s => s.type === 'passive-persuade');
  if(persuadeSkill) intel += persuadeSkill.amount;

  const dice = Math.max(1, Math.floor(intel / 2));
  const rolls = Array.from({ length:dice }, () => rollDie());
  const success = rolls.some(r => r === 5 || r === 6);

  const roleCount = { maid:target.maids, eunuch:target.eunuchs, physician:target.physicians }[role];
  const turnedCount = target.staffTurned[role] || 0;
  const roleName = { maid:'宮女', eunuch:'太監', physician:'太醫' }[role];
  let text = '';

  if(roleCount < 1){
    text = `策反失敗：${charOf(target.charId).name}宮中目前並無此種宮人可供收買。`;
  } else if(turnedCount >= roleCount){
    text = `策反無效：${charOf(target.charId).name}宮中現有的 ${roleCount} 名【${roleName}】已全數被策反變節，無忠心宮人可再收買。`;
  } else if(success){
    target.staffTurned[role] = turnedCount + 1;
    text = `【策反大獲全勝】你施展巧言與重金，成功令${charOf(target.charId).name}宮中的一名【${roleName}】暗中簽下投名狀！（該宮【${roleName}】已變節 ${target.staffTurned[role]} / ${roleCount} 人）若其宮中此類宮人全數叛變，往後指派必生反噬！`;
    addLog(`${charOf(p.charId).name}暗中於西華門密會他宮眼線，播下了變節的種子……`, { secret:true, revealRound:G.round+1 });
  } else {
    text = `策反失利：暗樁接觸失敗，擲骰結果：${rolls.join('、')}（未能擲出 5 或 6），所幸並未打草驚蛇。`;
  }

  G.lastActionResultText = text;
  G.turnStep = 'actionResult';
  render();
}

}

function resolveDixie(){
  const p = currentPlayer();
  const targetIdx = G.pendingAction.targetIdx;
  const target = G.players[targetIdx];

  const pIntel = effectiveStat(p, 'intel');
  const tIntel = effectiveStat(target, 'intel');

  const pBaseDice = Math.max(1, Math.floor(pIntel / 2));
  const tBaseDice = Math.max(1, Math.floor(tIntel / 2));

  const isTrulySitong = !!(target.pregnancy && target.pregnancy.fromSitong);

  const pBonusDice = isTrulySitong ? 2 : 0;
  const tBonusDice = isTrulySitong ? 0 : 2;

  const pTotalDice = pBaseDice + pBonusDice;
  const tTotalDice = tBaseDice + tBonusDice;

  const pRolls = Array.from({ length: pTotalDice }, () => rollDie());
  const tRolls = Array.from({ length: tTotalDice }, () => rollDie());

  const pSum = pRolls.reduce((a, b) => a + b, 0);
  const tSum = tRolls.reduce((a, b) => a + b, 0);

  G.dixieAnim = {
    stage: 'rolling',
    _started: false,
    targetIdx,
    isTrulySitong,
    pIntel,
    tIntel,
    pBaseDice,
    tBaseDice,
    pBonusDice,
    tBonusDice,
    pRolls,
    tRolls,
    pSum,
    tSum
  };
  G.turnStep = 'dixieAnim';
  render();
}

function runDixieDuelAnimation(){
  const anim = G.dixieAnim;
  const faces = ['1','2','3','4','5','6'];
  let ticks = 0;
  const iv = setInterval(() => {
    ticks++;
    for(let i=0; i<anim.pRolls.length; i++){
      const el = document.getElementById('dx_p_die_' + i);
      if(el) el.textContent = faces[rnd(6)];
    }
    for(let i=0; i<anim.tRolls.length; i++){
      const el = document.getElementById('dx_t_die_' + i);
      if(el) el.textContent = faces[rnd(6)];
    }
    if(ticks >= 12){
      clearInterval(iv);
      anim.stage = 'settled';
      render();
      setTimeout(() => {
        anim.stage = 'result';
        render();
      }, 450);
    }
  }, 75);
}

function finishDixieAnim(){
  const anim = G.dixieAnim;
  const p = currentPlayer();
  const target = G.players[anim.targetIdx];
  const pChar = charOf(p.charId);
  const tChar = charOf(target.charId);
  const isHuanghouAccuser = (p.charId === 'huanghou');

  let resultText = '';

  if(anim.isTrulySitong){
    if(anim.pSum > anim.tSum){
      target.alive = false;
      resultText = `【景仁宮風雲·鐵證如山】${pChar.name}（${anim.pSum}點）大勝${tChar.name}（${anim.tSum}點）！私通血脈確鑿，${tChar.name}被打入冷宮賜自盡，淘汰出局！`;
    } else if(anim.pSum < anim.tSum){
      if(isHuanghouAccuser){
        resultText = `【景仁宮大審·中宮恩赦】${tChar.name}辯才無礙（${anim.tSum}點 vs ${anim.pSum}點）自證清白！然皇后位居中宮母儀天下，皇上感念舊情未加降旨，皇后手牌不失且無須禁足！`;
      } else {
        p.hand = [];
        p.sickUntil = G.round + 2;
        resultText = `【景仁宮反咬·功虧一簣】${tChar.name}辯才無礙（${anim.tSum}點 vs ${anim.pSum}點）逆轉定局！${pChar.name}誣告失敗，遭罰沒手中全部道具卡，並被禁足 2 回合！`;
      }
    } else {
      resultText = `【景仁宮對質·平手相安】雙方擲骰皆為 ${anim.pSum} 點，爭執不下，各自作罷歸宮。`;
    }
  } else {
    if(anim.pSum < anim.tSum){
      if(isHuanghouAccuser){
        resultText = `【景仁宮大審·母儀無咎】${tChar.name}身正獲皇權庇佑（${anim.tSum}點 vs ${anim.pSum}點）！然皇后受太后力保與祖宗家法庇護，皇上好言相勸，皇后免於杖斃且毫髮無損！`;
      } else {
        p.alive = false;
        resultText = `【誣陷天子龍胎·當場杖斃】${tChar.name}身正獲皇權庇佑（${anim.tSum}點 vs ${anim.pSum}點）！${pChar.name}妄議皇家龍嗣大逆不道，當場被杖斃淘汰！`;
      }
    } else if(anim.pSum > anim.tSum){
      target.buffs.push({ stat:'beauty', amount:-5, untilRound:G.round + 3 });
      if(target.pregnancy){
        target.pregnancy = null;
        resultText = `【景仁宮屈打成招】${pChar.name}（${anim.pSum}點）勝過${tChar.name}（${anim.tSum}點）！${tChar.name}含冤受審驚懼交加，美貌 -5 點且不幸滑胎！`;
      } else {
        resultText = `【景仁宮屈打成招】${pChar.name}（${anim.pSum}點）勝過${tChar.name}（${anim.tSum}點）！${tChar.name}百口莫辯受審蒙羞，美貌 -5 點！`;

function resolveBaping(){
  const p = currentPlayer();
  const targetIdx = G.pendingAction.targetIdx;
  const target = G.players[targetIdx];

  const turnedPhys = p.staffTurned['physician'] || 0;
  if(turnedPhys >= p.physicians && p.physicians > 0){
    const failMsg = `【太醫全員欺瞞】小主宮中隨侍太醫已全數被收買變節！太醫回宮後滿口胡言謊報脈象，使您一無所獲，且變節身分當場曝光！`;
    addLog(`${charOf(p.charId).name}宣召太醫密探${charOf(target.charId).name}之脈象，洞悉了六宮深閨秘辛。`);
    G.lastActionResultText = failMsg;
    G.turnStep = 'actionResult'; render(); return;
  }

  if(!p.knownSitong) p.knownSitong = {};
  p.knownSitong[targetIdx] = !!(target.pregnancy && target.pregnancy.fromSitong);

  const phase = cyclePhase(target);
  const phaseText = { menses:'氣血虛浮之【月經期】', follicular:'平和蓄力之【濾泡期】', ovulation:'胞宮溫熱最適受孕之【排卵期】' }[phase];
  let pregText = '脈象平穩，寸關無滑，尚未懷有身孕。';

  if(target.pregnancy){
    const elapsed = G.round - target.pregnancy.startRound + 1;
    if(target.pregnancy.fromSitong){
      pregText = `<b style="color:var(--crimson);">寸關尺三脈滑利如走珠，千真萬確已身懷六甲（第 ${elapsed} 回合）！且此胎氣血微異，恐非承恩龍脈，乃是與外男【私通】暗結之胎！</b>`;
    } else {
      pregText = `<b style="color:var(--jade);">三部九候滑疾如流珠，乃得沐皇恩之大喜龍脈（已懷胎第 ${elapsed} 回合）！</b>`;
    }
  }

  const text = `【平安脈秘奏】太醫謹慎回奏：${charOf(target.charId).name}目前正處於 ${phaseText}。體內息肉脈象明細：${pregText}`;
  addLog(`${charOf(p.charId).name}宣召太醫密探${charOf(target.charId).name}之脈象，洞悉了六宮深閨秘辛。`);
  G.lastActionResultText = text;
  G.turnStep = 'actionResult';
  render();
}

function resolveGift(){
  const p = currentPlayer();
  const iid = val('f_item');
  const targetIdx = G.pendingAction.targetIdx;
  const target = G.players[targetIdx];
  const it = itemOf(iid);

  const loyalMaids = p.maids - (p.staffTurned['maid'] || 0);
  const loyalEunuchs = p.eunuchs - (p.staffTurned['eunuch'] || 0);

  if(loyalMaids <= 0 && loyalEunuchs <= 0 && (p.maids + p.eunuchs > 0)){
    consumeItem(p, iid);
    const text = `【叛奴私吞厚禮】小主宮中所有宮女與太監已全數變節！差遣辦差之奴才半道將名貴「${it.name}」私吞截留，送禮以失敗告終！`;
    addLog(text, { type:'drama' });
    G.lastActionResultText = text;
    G.turnStep = 'actionResult'; render(); return;
  }

  consumeItem(p, iid);
  target.hand.push(iid);
  const text = `小主差遣貼心宮人將珍貴之「${it.name}」敬贈予${charOf(target.charId).name}，以結深宮金蘭之好。`;
  addLog(`【姐妹示好】${charOf(p.charId).name}向${charOf(target.charId).name}敬贈了一匣禮品。`);
  G.lastActionResultText = text;
  G.turnStep = 'actionResult';
  render();
}

function resolveSteal(){
  const p = currentPlayer();
  const targetIdx = G.pendingAction.targetIdx;
  const target = G.players[targetIdx];

  const turnedEunuchs = p.staffTurned['eunuch'] || 0;
  if(turnedEunuchs >= p.eunuchs && p.eunuchs > 0){
    const text = `【太監全員反骨】派遣行竊之太監已全數變節！暗中向${charOf(target.charId).name}宮裡通風報信，偷竊當場失風，叛變身分當眾敗露！`;
    addLog(text, { type:'drama' });
    G.lastActionResultText = text;
    G.turnStep = 'actionResult'; render(); return;
  }

  if(!target.equipped.length){
    G.lastActionResultText = `${charOf(target.charId).name}身上並無任何穿戴首飾可供竊取。`;
  } else {
    const stolenIid = pick(target.equipped);
    target.equipped = target.equipped.filter(x => x !== stolenIid);
    p.hand.push(stolenIid);
    const it = itemOf(stolenIid);
    const text = `【暗室盜寶】太監手腳麻利，趁夜悄然順走了${charOf(target.charId).name}身邊的「${it.name}」歸入小主私庫！`;
    addLog(`【宮闈失竊】${charOf(target.charId).name}宮中晨起清點，發現一件名貴佩飾不翼而飛！`, { type:'drama' });
    G.lastActionResultText = text;
  }
  G.turnStep = 'actionResult';
  render();
}

function resolveZhangbi(){
  const p = currentPlayer();
  const role = val('f_role');
  const roleName = { maid:'宮女', eunuch:'太監', physician:'太醫' }[role];

  if({ maid:p.maids, eunuch:p.eunuchs, physician:p.physicians }[role] < 1){
    G.lastActionResultText = '小主宮中已無此等奴僕可處死。';
  } else {
    if(role === 'maid') p.maids--;
    else if(role === 'eunuch') p.eunuchs--;
    else p.physicians--;

    const hadTurned = (p.staffTurned[role] || 0) > 0;
    if(hadTurned){
      p.staffTurned[role]--;
    }

    const text = hadTurned 
      ? `【重刑整飭宮規】刑杖齊下！${charOf(p.charId).name}當著闔宮之面將一名變節之${roleName}活活杖斃！內應伏誅，肅清門戶！（該類宮人尚餘 ${p.staffTurned[role]} 名叛徒）`
      : `【杖斃示威】刑杖齊下！${charOf(p.charId).name}處死了一名${roleName}以儆效尤。`;
    addLog(text, { type:'drama' });
    G.lastActionResultText = text;
  }
  G.turnStep = 'actionResult';
  render();
}

  }
  const ev = G.currentEvent;
  app.innerHTML = `

      <div class="drama-quote"><span>「前朝後宮息息相關，今日風向又吹向了哪一處宮闈……」</span></div>

      </div>

        <button class="gold" onclick="resolveEvent()"><i class="fa-solid fa-bullhorn"></i> 太后宣告 · 套用六宮時局</button>
      </div>
    </div>
    ${renderLogCard()}
  `;

function resolveEvent(){
  const ev = G.currentEvent;
  const alive = G.players.filter(p => p.alive);
  let text = `【六宮時事】「${ev.name}」— ${ev.desc}`;

  switch(ev.id){
    case 'toufeng': {
      const t = pick(alive);
      if(tryShieldBlock(t, ev.name)){ text += `（${charOf(t.charId).name}以東阿阿膠消弭了病痛）`; }
      else { t.sickUntil = G.round + 1; text += ` 受波及抱恙者：${charOf(t.charId).name}`; }
      break;
    }
    case 'shiyi': {
      G.globalFavorPauseUntil = G.round + 3;
      text += `（紫禁城封宮防禦，侍寢全面暫停 3 回合！）`;
      break;
    }
    case 'yasang': {
      const t = pick(alive);
      if(tryShieldBlock(t, ev.name)){ text += `（${charOf(t.charId).name}阿膠護身未受啞嗓之害）`; }
      else { t.buffs.push({ stat:'talent', amount:-3, untilRound:G.round + 2 }); text += ` 嗓音受損者：${charOf(t.charId).name}`; }
      break;
    }
    case 'songpi': {
      const t = pick(alive);
      if(tryShieldBlock(t, ev.name)){ text += `（${charOf(t.charId).name}以御賜阿膠葆光煥采免受容顏折損）`; }
      else { t.buffs.push({ stat:'beauty', amount:-3, untilRound:G.round + 2 }); text += ` 容顏鬆弛者：${charOf(t.charId).name}`; }
      break;
    }
    case 'jingong': {
      G.extraDrawNextRound = true;
      text += `（下回合所有小主額外加抽 1 張道具卡）`;
      break;
    }
    case 'gongnv': {
      const t = pick(alive);
      if(t.maids < 4){ t.maids++; text += ` 獲賜宮女者：${charOf(t.charId).name}`; }
      else { text += ` （${charOf(t.charId).name}宮女已滿編 4 人，無須增補）`; }
      break;
    }
    case 'taijian': {
      const t = pick(alive);
      if(t.eunuchs < 2){ t.eunuchs++; text += ` 獲賜太監者：${charOf(t.charId).name}`; }
      else { text += ` （${charOf(t.charId).name}太監已滿編 2 人，無須增補）`; }
      break;
    }
    case 'gewu': {
      let best = null;
      alive.forEach(p => {
        const s = effectiveStat(p, 'talent');
        if(!best || s > best.s) best = { p, s };
      });
      text += ` 歌舞奪魁者：${charOf(best.p.charId).name}（技壓群芳，今夕欽定直接侍寢！）`;
      G.forcedServer = best.p.idx;
      break;
    }
    case 'daqing': {
      let best = null;
      alive.forEach(p => {
        const s = effectiveStat(p, 'beauty');
        if(!best || s > best.s) best = { p, s };
      });
      for(let i=0; i<3; i++){
        let pool = ITEM_POOL.filter(x => x.cat !== 'special');
        if(DEBUG_MODE) pool = pool.filter(x => x.id !== 'shiyibeizu');
        best.p.hand.push(pick(pool).id);
      }
      text += ` 國色天香榜首：${charOf(best.p.charId).name}（獲賜內務府珍寶三匣）`;
      break;
    }
  }
  addLog(text, { type:'drama' });
  G.currentEvent = null;
  G.phase = 'favor';
  render();
}

/* ================= 6. 翻綠頭牌 · 侍寢爭寵結算 ================= */
function renderFavor(){
  const alive = G.players.filter(p => p.alive);

  if(!DEBUG_MODE && G.round <= (G.globalFavorPauseUntil || 0)){
    app.innerHTML = `
      <div class="card">
        <h2>敬事房翻牌 · 暫歇侍寢 <span class="tag">FAVOR</span></h2>
        <div class="drama-quote"><span>「疫厲橫行，龍體欠安，太后降旨暫免六宮進御三回……」</span></div>
        <p class="muted">因時疫橫行，今宵翻牌撤案，無人承寵。</p>
        <div class="row" style="margin-top:12px;">
          <button class="gold" onclick="finishRound()"><i class="fa-solid fa-moon"></i> 今夕夜深 · 結算回合</button>
        </div>
      </div>
      ${renderLogCard()}
    `;
    return;
  }

  if(!G.favorScoredDone){
    let forcedIdx = G.forcedServer;
    G.forcedServer = null;

    let eligible = alive.filter(p => {
      const ph = cyclePhase(p);
      const preg = !!p.pregnancy;
      const sick = G.round <= p.sickUntil;
      return ph !== 'menses' && !preg && !sick;
    });

    G.favorForced = (forcedIdx !== undefined && forcedIdx !== null && alive.find(p => p.idx === forcedIdx)) ? forcedIdx : null;
    G.favorScored = null;
    G.favorFenghuoCandidate = null;

    if(G.favorForced === null && eligible.length > 0){
      const designated = pick(alive);
      const scored = eligible.map(p => {
        let score = effectiveStat(p, 'beauty') + effectiveStat(p, 'talent');
        const favSkill = charOf(p.charId).skills.find(s => s.type === 'passive-favor');
        if(favSkill) score += favSkill.amount;
        if(p.idx === designated.idx) score += 10;
        return { idx:p.idx, score };
      });
      scored.sort((a,b) => b.score - a.score);
      G.favorScored = scored;
      G.favorDesignated = designated.idx;
      G.favorDoubleFavor = (G.doubleFavorRound === G.round);

      if(scored.length > 1){
        const secondIdx = scored[1].idx;
        const secondPlayer = G.players[secondIdx];
        const fenghuo = charOf(secondPlayer.charId).skills.find(s => s.type === 'active-forceserve');
        if(fenghuo && skillAvailable(secondPlayer, fenghuo.key)){
          G.favorFenghuoCandidate = secondIdx;
        }
      }
    }
    G.favorScoredDone = true;
  }

  if(G.favorFenghuoCandidate !== null && G.favorFenghuoDecision === undefined){
    const fenghuoPlayer = G.players[G.favorFenghuoCandidate];
    if(fenghuoPlayer.isAi){
      decideFenghuo(true);
      return;
    }
    renderFenghuoPrompt();
    return;
  }

  if(!G.favorComputed){
    let winnerIdx = null, winner2Idx = null;
    if(G.favorForced !== null){
      winnerIdx = G.favorForced;
    } else if(G.favorScored){
      if(G.favorFenghuoDecision === true){
        winnerIdx = G.favorFenghuoCandidate;
      } else {
        winnerIdx = G.favorScored[0].idx;
        if(G.favorDoubleFavor && G.favorScored.length > 1){
          winner2Idx = G.favorScored[1].idx;
        }
      }
    }
    G.favorComputed = true;
    G.favorWinner = winnerIdx;
    G.favorWinner2 = winner2Idx;
  }

  const winner = G.favorWinner !== null ? G.players[G.favorWinner] : null;
  const winner2 = (G.favorWinner2 !== null && G.favorWinner2 !== undefined) ? G.players[G.favorWinner2] : null;
  const names = [winner, winner2].filter(Boolean).map(w => charOf(w.charId).name).join(' 與 ');

  app.innerHTML = `
    <div class="card">
      <h2>敬事房呈綠頭牌 · 侍寢爭寵 <span class="tag">FAVOR</span></h2>
      ${G.favorScored ? `
        <div style="background:#fffcf2; border:1px solid var(--gold); padding:8px 12px; margin-bottom:12px; display:flex; align-items:center; gap:10px;">
          <img src="${charOf(G.players[G.favorDesignated].charId).avatar}" class="char-avatar sm" onerror="this.src='https://placehold.co/60x60/7a1f2b/f4e5bf?text=牌'">
          <div>皇上今日初翻綠頭牌：<b>${charOf(G.players[G.favorDesignated].charId).name}</b>（享 +10 侍寢點數加成）</div>
        </div>
        <div class="itemlist">
          ${G.favorScored.map(s => {
            const pl = G.players[s.idx];
            const ch = charOf(pl.charId);
            return `
              <div class="itemrow">
                <span style="display:flex; align-items:center; gap:8px;">
                  <img src="${ch.avatar}" class="char-avatar sm" onerror="this.src='https://placehold.co/50x50/7a1f2b/f4e5bf?text=${encodeURIComponent(ch.name)}'">
                  <span class="nm">${ch.name}</span>
                </span>
                <span class="ds" style="font-weight:bold; color:var(--crimson-dark); font-size:.9rem;">爭寵點數：${s.score} 點</span>
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}
      ${winner ? `
        <div class="drama-quote" style="font-size:.95rem;">
          <span>鳳鸞春恩車響鈴鳴動，駛向御前！今夕蒙沐聖恩者：<b style="color:var(--crimson);">${names}</b>！</span>
        </div>
      ` : `
        <p class="muted">（六宮主位今夕皆因身懷六甲、癸水月經或臥病，無人合乎進御之規，今夜空懸）</p>
      `}
      <div class="row" style="margin-top:14px;">
        <button class="gold" onclick="announceFavorWinner()"><i class="fa-solid fa-scroll"></i> 敬事房宣旨承恩 · 移入寢殿</button>
      </div>
    </div>
    ${renderLogCard()}
  `;
}

function renderFenghuoPrompt(){
  const p = G.players[G.favorFenghuoCandidate];
  const c = charOf(p.charId);
  const skill = c.skills.find(s => s.type === 'active-forceserve');
  app.innerHTML = `
    <div class="card">
      <h2>翊坤宮霸道截車 · 烽火連天 <span class="tag">SPECIAL</span></h2>
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
        <img src="${c.avatar}" class="char-avatar lg" onerror="this.src='https://placehold.co/100x100/7a1f2b/f4e5bf?text=${encodeURIComponent(c.name)}'">
        <div>
          <div class="drama-quote" style="margin:0 0 6px;"><span>${c.quote}</span></div>

        </div>
      </div>

      </div>

}

function decideFenghuo(useIt){
  G.favorFenghuoDecision = useIt;
  if(useIt){
    const p = G.players[G.favorFenghuoCandidate];
    const c = charOf(p.charId);
    const skill = c.skills.find(s => s.type === 'active-forceserve');
    useSkillCooldown(p, skill.key, skill.cooldown);
    addLog(`【烽火連天】華妃年世蘭鳳眸含威，霸道截下鳳鸞春恩車，無視點數強行登車侍寢！`, { type:'drama' });
  }
  render();
}

function announceFavorWinner(){
  const winners = [G.favorWinner, G.favorWinner2].filter(w => w !== null && w !== undefined);
  if(!winners.length){
    addLog(`敬事房回奏：今宵無人侍寢，御前熄燈。`);
  } else {
    addLog(`【鳳鸞春恩】本回合侍寢者：${winners.map(idx => charOf(G.players[idx].charId).name).join('、')}。`, { type:'drama' });
  }

  G.favorScoredDone = false;
  G.favorComputed = false;
  G.favorScored = null;
  G.favorForced = null;
  G.favorFenghuoCandidate = null;
  G.favorFenghuoDecision = undefined;
  G.favorDoubleFavor = false;
  G.favorWinner2 = null;
  G.doubleFavorRound = null;

  G.pregnancyQueue = winners.filter(idx => {
    const pl = G.players[idx];
    return pl && pl.alive;
  });
  proceedPregnancyQueue();
}

function proceedPregnancyQueue(){
  if(G.pregnancyQueue && G.pregnancyQueue.length > 0){
    const targetIdx = G.pregnancyQueue[0];
    const target = G.players[targetIdx];
    if(!target || !target.alive){
      G.pregnancyQueue.shift();
      proceedPregnancyQueue();
      return;
    }

    const isOvulation = (cyclePhase(target) === 'ovulation') && !target.pregnancy;

    if(target.isAi){
      if(isOvulation){
        const result = performPregnancyRoll(target);
        if(result.pregnant){
          target.pregnancy = { startRound: G.round, fromSitong: false };
        }
      }
      G.pregnancyQueue.shift();
      proceedPregnancyQueue();
      return;
    }

    G.phase = 'pregnancyGate';
    G.pregnancyGateTarget = targetIdx;
    G.pregnancyGateRevealed = false;
    G.pregAnimMode = 'favor';

    if(isOvulation){
      const result = performPregnancyRoll(target);
      if(result.pregnant){
        target.pregnancy = { startRound: G.round, fromSitong: false };
      }
      G.pregAnimResult = result;
    } else {
      G.pregAnimResult = null;
    }
    render();
  } else {
    checkDeliveryOrFinish();
  }
}

        </div>
        <div class="name">${c.name} · ${c.title}</div>

      <div class="card">
        <h2>養心殿承恩 · 侍寢私密紀事 <span class="tag">起居注密奏</span></h2>

          <p class="muted">

            <b style="color:var(--jade);">【防窺保密生效】外人僅知小主侍寢，無從窺探您今夜是否處於排卵期！</b>
          </p>
          <div class="row" style="justify-content:center; margin-top:16px;">
            <button class="gold" onclick="advancePregnancyQueue()"><i class="fa-solid fa-check"></i> 領旨知悉 · 退出寢殿</button>
          </div>
        </div>
      </div>
    `;
    return;
  }

  const anim = G.pregAnim || { stage:'result' };
  const showDie = anim.stage !== 'die-init';
  const dieSettled = anim.stage !== 'die-init' && anim.stage !== 'die-rolling';
  const showCards = anim.stage === 'cards' || anim.stage === 'result';
  const cardsFlipped = anim.stage === 'result';

  app.innerHTML = `
    <div class="card">
      <h2>${isSitong ? '私通幽會 · 喜脈暗結檢定':'排卵承恩 · 皇嗣天命判定'} <span class="tag">密訊</span></h2>
      <p class="muted" style="text-align:center;">
        ${anim.stage==='die-rolling' ? '<i class="fa-solid fa-dice fa-spin"></i> 天命玉骰翻滾中…' : (anim.stage==='cards' ? '<i class="fa-solid fa-wand-magic-sparkles"></i> 抽取數字卡中…':'天命歸位 · 判定結算')}
      </p>
      
      <div class="dice-wrap">
        <div id="diceFace" class="dice-box ${dieSettled ? 'settled':''}">${dieSettled ? r.die : '<i class="fa-solid fa-question"></i>'}</div>
      </div>

      ${r.cards.length ? `
        <div class="cards-wrap">

              <div class="face back"><i class="fa-solid fa-dragon"></i></div>
              <div class="face front">${v}</div>

      ` : (showCards ? '<p class="muted" style="text-align:center;">（受麝毒阻滯，本次無任何數字卡可抽）</p>' : '')}

      ${anim.stage === 'result' ? `
        <div style="text-align:center; margin-top:14px;">

              <span>雨露雖施，奈何天命未允。今宵玉骰（${r.die}點）未中命格卡（${r.cards.join('、')}），未能結珠懷胎。</span>
            </div>
          `}
          <div class="row" style="justify-content:center; margin-top:14px;">
            <button class="gold" onclick="finishPregnancyGate()"><i class="fa-solid fa-arrow-right"></i> ${isSitong ? '妥帖收卷 · 結束本宮回合並移交裝置' : '謹遵天命 · 妥帖收卷'}</button>
          </div>
        </div>

    </div>
  `;

  if(anim.stage === 'die-rolling' && !anim._started){

    runDiceAnimation(r.die);
  }
}

function revealPregnancyGate(){
  G.pregnancyGateRevealed = true;
  G.pregAnim = { stage:'die-rolling', _started:false };
  render();
}

function runDiceAnimation(finalDie){
  const faces = ['1','2','3','4','5','6'];
  let ticks = 0;
  const iv = setInterval(() => {
    const el = document.getElementById('diceFace');
    ticks++;
    if(ticks >= 12){
      clearInterval(iv);
      G.pregAnim.stage = 'die-settled';
      render();
      setTimeout(() => {
        G.pregAnim.stage = 'cards';
        render();
        startCardFlips();
      }, 450);
    } else if(el){
      el.textContent = faces[rnd(6)];
    }
  }, 70);
}

function startCardFlips(){
  const r = G.pregAnimResult;
  r.cards.forEach((v,i) => {
    setTimeout(() => {
      const el = document.getElementById('card' + i);
      if(el){
        el.classList.add('flipped');
        if(v === r.die) el.classList.add('match');
      }
    }, 300 + i * 400);
  });
  const totalWait = 300 + r.cards.length * 400 + 400;
  setTimeout(() => {
    G.pregAnim.stage = 'result';
    render();
  }, totalWait);
}

function finishPregnancyGate(){
  if(G.pregAnimMode === 'sitong'){
    G.phase = 'playerTurn';
    endPlayerTurn();
  } else {
    advancePregnancyQueue();
  }
}

function advancePregnancyQueue(){
  if(G.pregnancyQueue && G.pregnancyQueue.length > 0){
    G.pregnancyQueue.shift();
  }
  proceedPregnancyQueue();
}

/* ================= 8. 分娩檢定（五回合足月臨盆 · 阿哥/公主） ================= */
function checkDeliveryOrFinish(){
  G.deliveryQueue = G.players.filter(p => p.alive && p.pregnancy && (G.round - p.pregnancy.startRound + 1 >= 5)).map(p => p.idx);
  proceedDeliveryQueue();
}

function proceedDeliveryQueue(){
  if(G.deliveryQueue && G.deliveryQueue.length > 0){
    const targetIdx = G.deliveryQueue[0];
    const target = G.players[targetIdx];

    if(target.isAi){
      let die = rollDie();
      let isPrince = (die % 2 === 1);
      if(!isPrince && target.hand.includes('baoshengnan')){
        consumeItem(target, 'baoshengnan');
        die = rollDie();
        isPrince = (die % 2 === 1);
        addLog(`【逆天改命】${charOf(target.charId).name}服下秘傳「包生男」，分娩重定乾坤！`, { type:'drama' });
      }
      if(isPrince) target.princes++; else target.princesses++;
      target.pregnancy = null;
      addLog(`【景陽鐘鳴】${charOf(target.charId).name}順利分娩，誕育了一位${isPrince ? '【阿哥】':'【公主】'}！`, { type:'drama' });
      G.deliveryQueue.shift();
      proceedDeliveryQueue();
      return;
    }

    G.phase = 'deliveryGate';
    G.deliveryTarget = targetIdx;
    G.deliveryRevealed = false;
    G.deliveryResult = null;
    render();
  } else {
    finishRound();
  }
}

  app.innerHTML = `
    <div class="card">
      <h2>六宮產房密奏 · 皇嗣天命降生 <span class="tag">瓜熟蒂落</span></h2>
      <p class="muted" style="text-align:center;">
        ${anim.stage==='die-rolling' ? '<i class="fa-solid fa-dice fa-spin"></i> 產婆接生，天命玉骰翻滾中…' : '奇數為阿哥，偶數為公主'}
      </p>

      <div class="dice-wrap">
        <div id="delivDiceFace" class="dice-box ${dieSettled ? 'settled':''}">${dieSettled ? r.die : '<i class="fa-solid fa-question"></i>'}</div>

  G.delivAnim = { stage:'die-rolling', _started:false };
  render();
}

function runDeliveryDiceAnimation(finalDie){
  const faces = ['1','2','3','4','5','6'];
  let ticks = 0;
  const iv = setInterval(() => {
    const el = document.getElementById('delivDiceFace');
    ticks++;
    if(ticks >= 12){
      clearInterval(iv);
      G.delivAnim.stage = 'die-settled';
      render();
      setTimeout(() => {
        const cEl = document.getElementById('delivCard');
        if(cEl) cEl.classList.add('flipped');
        setTimeout(() => {
          G.delivAnim.stage = 'result';
          render();
        }, 400);

function rerollWithBaosheng(){

  consumeItem(target, 'baoshengnan');

function finishOneDelivery(){
  const target = G.players[G.deliveryTarget];
  const r = G.deliveryResult;
  if(r.isPrince) target.princes++; else target.princesses++;
  target.pregnancy = null;
  addLog(`【景陽鐘鳴】${charOf(target.charId).name}順利分娩，誕育了一位${r.isPrince ? '【阿哥】':'【公主】'}！`, { type:'drama' });

  G.deliveryQueue.shift();
  proceedDeliveryQueue();
}

/* ================= 9. 回合結算與終局奪嫡檢定 ================= */
function finishRound(){
  const alivePlayers = G.players.filter(p => p.alive);
  let winner = null;

  alivePlayers.forEach(p => {
    if(p.princes >= 2) winner = p;
    if(p.princesses >= 2 && p.princes >= 1) winner = p;
  });

  if(!winner && alivePlayers.length === 1 && G.players.length > 1){
    winner = alivePlayers[0];
  }

  if(winner){
    G.winner = winner;
    G.phase = 'gameOver';
    render();
    return;
  }

  G.players.forEach(p => {
    if(p.alive){
      p.cycleClock = (p.cycleClock + 1) % p.cycleTotal;
      p.buffs = p.buffs.filter(b => G.round < b.untilRound);

      if(p.equippedExp){
        for(const [iid, expRound] of Object.entries(p.equippedExp)){
          if(G.round >= expRound){
            p.equipped = p.equipped.filter(id => id !== iid);
            delete p.equippedExp[iid];
            addLog(`【佩飾藥效散盡】${charOf(p.charId).name}佩戴的「${itemOf(iid).name}」效力告罄，已卸下焚毀。`);
          }
        }
      }
    }
  });

  G.round++;
  startRound();
  render();
}

function runMonteCarloSimulation(totalGames = 200){
  const stats = {};
  CHARACTERS.forEach(c => {
    stats[c.id] = { id:c.id, name:c.name, wins:0, princesTotal:0, princessesTotal:0, totalFavor:0, pregTotal:0, poisonedOthers:0 };
  });

  let totalRoundsSum = 0;
  const gameLog = [];

  for(let g = 1; g <= totalGames; g++){
    const outcome = simulateSingleHeadlessGame();
    totalRoundsSum += outcome.round;
    if(outcome.winnerId && stats[outcome.winnerId]){
      stats[outcome.winnerId].wins++;
    }
    outcome.playerStats.forEach(ps => {
      if(stats[ps.charId]){
        stats[ps.charId].princesTotal += ps.princes;
        stats[ps.charId].princessesTotal += ps.princesses;
        stats[ps.charId].totalFavor += ps.favors;
        stats[ps.charId].pregTotal += ps.pregs;
      }
    });
    gameLog.push({ game:g, winnerId:outcome.winnerId, round:outcome.round, reason:outcome.reason });
  }

  const sorted = Object.values(stats).sort((a,b) => b.wins - a.wins);
  return {
    totalGames,
    avgRounds: (totalRoundsSum / totalGames).toFixed(1),
    ranking: sorted,
    gameLog
  };
}

function simulateSingleHeadlessGame(){
  const players = CHARACTERS.map((c, idx) => {
    const totalCycle = c.cycle.m + c.cycle.f + c.cycle.o;
    const startCount = Math.max(1, Math.floor(c.resource / 2));
    const hand = [];
    for(let i=0; i<startCount; i++){
      hand.push(pick(ITEM_POOL.filter(x => x.cat !== 'special')).id);
    }
    return {
      idx, charId: c.id,
      maids:2, eunuchs:1, physicians:1,
      staffTurned:{ maid:0, eunuch:0, physician:0 },
      hand, equipped:[], equippedExp:{}, buffs:[],
      pregDelta:0, preventMiscarryUntil:0, shieldCount:0, sickUntil:0,
      cycleTotal: totalCycle, cycleClock: rnd(totalCycle),
      pregnancy: null, skillCooldownUntil:{},
      skillUsesLeft: Object.fromEntries(c.skills.filter(s=>s.usesLeft!==undefined).map(s=>[s.key,s.usesLeft])),
      knownSitong:{},
      alive: true, princes:0, princesses:0, miscarryStackCount:0,
      favors:0, pregs:0
    };
  });

  let round = 1;
  let winnerId = null;
  let reason = '';

  while(round <= 35 && !winnerId){
    for(const p of players){
      if(!p.alive) continue;
      const c = charOf(p.charId);
      const isSick = round <= p.sickUntil;

      p.hand.push(pick(ITEM_POOL.filter(x => x.cat !== 'special')).id);

      const equips = p.hand.filter(id => itemOf(id).cat === 'equip' || itemOf(id).equippable);
      if(equips.length){
        const eqId = equips[0];
        p.hand.splice(p.hand.indexOf(eqId), 1);
        p.equipped.push(eqId);
      }

      if(p.charId === 'anda_ying' && (p.skillUsesLeft['chenshui']||0) > 0 && p.hand.length){
        p.hand.splice(0, 1, 'shexiang');
        p.skillUsesLeft['chenshui']--;
      }

      if(p.charId === 'wanpin' && round >= (p.skillCooldownUntil['dieren']||0)){
        p.buffs.push({ stat:'beauty', amount:5, untilRound:round+1 });
        p.buffs.push({ stat:'talent', amount:5, untilRound:round+1 });
        p.skillCooldownUntil['dieren'] = round + 3;
      }
      if(p.charId === 'huanghou' && round >= (p.skillCooldownUntil['chunyuan']||0)){
        ['beauty','intel','talent'].forEach(stat => p.buffs.push({ stat, amount:5, untilRound:round+1 }));
        p.skillCooldownUntil['chunyuan'] = round + 3;
      }

      if(isSick) continue;

      const others = players.filter(o => o.alive && o.idx !== p.idx);
      if(others.length){
        const confirmedSitong = others.find(o => o.pregnancy && p.knownSitong[o.idx]);
        const target = confirmedSitong || others.find(o => o.pregnancy) || others[rnd(others.length)];
        const phase = (p.cycleClock < c.cycle.m) ? 'menses' : (p.cycleClock < c.cycle.m + c.cycle.f ? 'follicular' : 'ovulation');
        const poisons = p.hand.filter(id => itemOf(id).cat === 'poison');

        if((confirmedSitong && rnd(100) < 65) || (p.charId === 'huanghou' && target && target.pregnancy && rnd(100) < 40)){
          const isSitongTarget = !!(target.pregnancy && target.pregnancy.fromSitong);
          let pDice = Math.max(1, Math.floor(effectiveStat(p, 'intel') / 2)) + (isSitongTarget ? 2 : 0);
          let tDice = Math.max(1, Math.floor(effectiveStat(target, 'intel') / 2)) + (isSitongTarget ? 0 : 2);
          let pSum = Array.from({length:pDice}, ()=>rollDie()).reduce((a,b)=>a+b,0);
          let tSum = Array.from({length:tDice}, ()=>rollDie()).reduce((a,b)=>a+b,0);
          if(pSum > tSum){
            if(isSitongTarget){
              target.alive = false;
            } else {
              target.pregnancy = null;
            }
          } else if(pSum < tSum && p.charId !== 'huanghou'){
            if(!isSitongTarget){
              p.alive = false;
            }
          }
        }
        else if(p.charId === 'huiguiren' && phase === 'ovulation' && (p.skillUsesLeft['tianxian']||0) > 0){
          p.skillUsesLeft['tianxian']--;
          const die = rollDie();
          const cards = [drawNumberCard(), drawNumberCard()];
          if(cards.includes(die)){ p.pregnancy = { startRound:round, fromSitong:false }; p.pregs++; }
        } else if(phase === 'ovulation' && !p.pregnancy && rnd(100) < 40){
          const die = rollDie();
          const cards = [drawNumberCard(), drawNumberCard()];
          if(cards.includes(die)){ p.pregnancy = { startRound:round, fromSitong:true }; p.pregs++; }
        } else if(poisons.length && target){
          const pIid = poisons[0];
          const it = itemOf(pIid);
          p.hand.splice(p.hand.indexOf(pIid), 1);
          let dice = Math.max(1, Math.floor(effectiveStat(p, 'intel') / 2));
          if(charOf(target.charId).skills.some(s => s.type === 'passive-poisonresist')) dice = Math.max(1, Math.floor(dice/2));
          const rolls = Array.from({length:dice}, ()=>rollDie());
          if(!it.check || rolls.some(r => it.check.includes(r))){
            if(target.pregnancy && round > (target.preventMiscarryUntil||0) && target.shieldCount <= 0){
              if(it.effect === 'miscarry') target.pregnancy = null;
            }
          }
        } else if(target.pregnancy && p.physicians > 0){
          p.knownSitong[target.idx] = !!(target.pregnancy && target.pregnancy.fromSitong);
        }
      }
    }

    const alive = players.filter(p => p.alive);
    const eligible = alive.filter(p => {
      const c = charOf(p.charId);
      const ph = (p.cycleClock < c.cycle.m) ? 'menses' : (p.cycleClock < c.cycle.m + c.cycle.f ? 'follicular' : 'ovulation');
      return ph !== 'menses' && !p.pregnancy && round > p.sickUntil;
    });

    if(eligible.length){
      const des = pick(alive);
      const scored = eligible.map(p => {
        let sc = effectiveStat(p, 'beauty') + effectiveStat(p, 'talent');
        if(p.charId === 'anda_ying') sc += 3;
        if(p.idx === des.idx) sc += 10;
        return { p, sc };
      }).sort((a,b) => b.sc - a.sc);

      let winnerP = scored[0].p;
      if(scored.length > 1 && scored[1].p.charId === 'huafei' && round >= (scored[1].p.skillCooldownUntil['fenghuo']||0)){
        winnerP = scored[1].p;
        winnerP.skillCooldownUntil['fenghuo'] = round + 3;
      }

      winnerP.favors++;
      const c = charOf(winnerP.charId);
      const ph = (winnerP.cycleClock < c.cycle.m) ? 'menses' : (winnerP.cycleClock < c.cycle.m + c.cycle.f ? 'follicular' : 'ovulation');
      if(ph === 'ovulation' && !winnerP.pregnancy){
        const d = rollDie();
        const cds = [drawNumberCard(), drawNumberCard()];
        if(cds.includes(d)){
          winnerP.pregnancy = { startRound:round, fromSitong:false };
          winnerP.pregs++;
        }
      }
    }

    for(const p of alive){
      if(p.pregnancy && (round - p.pregnancy.startRound + 1 >= 5)){
        let d = rollDie();
        let isP = (d % 2 === 1);
        if(!isP && p.hand.includes('baoshengnan')){
          p.hand.splice(p.hand.indexOf('baoshengnan'), 1);
          d = rollDie();
          isP = (d % 2 === 1);
        }
        if(isP) p.princes++; else p.princesses++;
        p.pregnancy = null;
      }
    }

    for(const p of alive){
      if(p.princes >= 2){ winnerId = p.charId; reason = '誕育 2 位阿哥，母憑子貴！'; break; }
      if(p.princesses >= 2 && p.princes >= 1){ winnerId = p.charId; reason = '誕育 1 阿哥 2 公主，枝繁葉茂！'; break; }
    }

    players.forEach(p => {
      p.cycleClock = (p.cycleClock + 1) % p.cycleTotal;
      p.buffs = p.buffs.filter(b => round < b.untilRound);
    });

    round++;
  }

  return {
    winnerId: winnerId || (players.filter(p=>p.alive).sort((a,b)=> (b.princes*2 + b.princesses) - (a.princes*2 + a.princesses))[0].charId),
    round: Math.min(round, 35),
    reason: reason || '回合上限結算子嗣總分勝出',
    playerStats: players.map(p => ({
      charId: p.charId, princes: p.princes, princesses: p.princesses,
      favors: p.favors, pregs: p.pregs
    }))
  };
}

function handleAssetUpload(charId, input){
  if(input.files && input.files[0]){
    const reader = new FileReader();
    reader.onload = function(e){
      const c = charOf(charId);
      if(c){
        c.avatar = e.target.result;
        const prev = document.getElementById('preview_' + charId);
        if(prev) prev.src = c.avatar;
        render();
      }
    };
    reader.readAsDataURL(input.files[0]);
  }
}

render();
</script>
